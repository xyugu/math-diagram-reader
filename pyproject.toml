[project]
name = "mathvlm"
version = "0.1.0"
description = "Fine-tune a small VLM to transcribe math question images into structured JSON (Markdown+LaTeX text + re-plottable diagram scene graph)."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # --- model / inference ---
    "torch>=2.13.0,<2.15.0",
    # Pinned exactly: unsloth 2026.10.8 caps transformers at <=5.17.0, and 5.17.0 is the
    # newest release that ships `models/qwen3_5` (registered as Qwen3_5ForConditionalGeneration
    # under AutoModelForImageTextToText). Pinning here lets Phase 1 (inference) and Phase 2
    # (unsloth training) share one environment. Revisit when unsloth widens its range.
    "transformers==5.17.0",
    # Required by AutoProcessor: Qwen3.5's processor instantiates a video sub-processor
    # (Qwen3VLVideoProcessor) which imports torchvision, even though we never pass video.
    "torchvision>=0.21",
    "accelerate>=1.15.0",
    # Triton kernels for Qwen3.5's gated-delta-rule layers; without it transformers falls
    # back to a slow reference PyTorch path. Pure Python, no compiler needed.
    "flash-linear-attention>=0.6.0",
    # --- schema & config ---
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    # --- rendering & data ---
    "matplotlib>=3.11",
    "pillow>=11.0",
    "numpy>=2.1",
    "scipy>=1.15",          # linear_sum_assignment (Hungarian matching)
    # --- metrics & CLI ---
    "rapidfuzz>=3.10",      # normalized edit distance
    "tqdm>=4.67",
]

[project.optional-dependencies]
# Phase 2 (LoRA SFT). Kept out of the default sync so Phase 1 stays lean and
# cannot be blocked by unsloth's torch pins. Install with: uv sync --extra train
train = [
    "unsloth>=2026.10.8",
    "unsloth_zoo>=2026.10.8",
    # unsloth 2026.10.8 pins trl<=1.15.0, so the latest trl (1.16.0) cannot be used.
    # Revisit when unsloth widens the range.
    "trl>=1.14.0,<=1.15.0",
    "peft>=0.21.2",
    "datasets>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mathvlm"]

# ---------------------------------------------------------------------------
# torch must come from the CUDA 13.0 index: the default PyPI wheel is not
# guaranteed to carry sm_120 (Blackwell / RTX 50-series) kernels.
# ---------------------------------------------------------------------------
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["unsloth_compiled_cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
# Geometry code names variables after points (O for a circle center, I for an incenter).
"src/mathvlm/generate/*" = ["E741"]
