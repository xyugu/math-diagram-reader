# ---------------------------------------------------------------------------
# THE config file. Every tunable in the project lives here.
# Read via `mathvlm.config.load_config()`. No magic numbers in module bodies.
# ---------------------------------------------------------------------------

seed: 1234 # master seed; per-sample seeds are spawned from this

paths:
  data_dir: data # symlink -> ~/vlm_data (ext4)
  outputs_dir: outputs # symlink -> ~/vlm_outputs (ext4)
  hf_home: ~/.cache/huggingface # ext4; keep the model cache off the 9p mount

model:
  id: Qwen/Qwen3.5-2B # post-trained multimodal; NOT the -Base variant
  dtype: bfloat16
  device_map: cuda:0
  attn_implementation: sdpa # flash_attention_2 is a Phase 2 experiment
  enable_thinking: false # MUST stay false: a reasoning preamble breaks JSON parsing
  max_new_tokens: 1024
  do_sample: false # greedy: baseline must be reproducible

# Diagram schema constants. Changing these is a schema change -> tell the user.
schema:
  grid_min: 0
  grid_max: 100
  unnamed_prefix: _P
  # Tolerances for schema.consistency_issues() -- the *soft* geometric checks the
  # synthetic generator asserts. They are not part of the schema's shape.
  consistency_collinear_tol: 1.5 # grid units; integer rounding moves points <= ~0.71
  consistency_angle_tol_deg: 6.0 # rounding on an 18-unit side shifts angles a few deg
  consistency_length_tol: 2.0 # grid units, for equal_length

render:
  dpi: 110
  figure_width_in: 5.0 # diagram panel (square)
  question_width_in: 5.0 # page width; the question text wraps to this
  page_margin_in: 0.25
  text_diagram_gap_in: 0.15
  line_spacing: 1.3 # multiple of each line's measured height
  diagram_pad: 8.0 # blank grid units around the 0-100 grid, room for outer labels
  usetex: false # mathtext only in Phase 1; true would require a texlive install
  # Fonts: matplotlib-bundled only, so the lockfile pins them (no system fonts).
  mathtext_fontset: dejavusans # default style; sample_style() draws from `fontsets`
  fontsets: [dejavusans, dejavuserif, cm, stix, stixsans]
  text_family: # plain-text font paired with each mathtext fontset
    dejavusans: DejaVu Sans
    dejavuserif: DejaVu Serif
    cm: cmr10
    stix: STIXGeneral
    stixsans: DejaVu Sans
  ink: "#000000"
  inks: ["#000000", "#141414", "#1f2a44", "#2b2b2b"]
  line_width: 1.6
  line_width_jitter: [1.0, 2.4]
  point_marker_size: 4.0
  point_marker_size_jitter: [2.5, 5.0]
  point_dot_prob: 0.5 # dots on every point; circle centers always get one
  label_fontsize: 11
  label_fontsize_jitter: [10.0, 13.0]
  label_italic_prob: 0.6 # italic ($A$) vs upright point labels
  label_offset_pt: 8.0
  question_fontsize: 11
  question_fontsize_jitter: [10.0, 12.5]
  mark_size: 4.5 # grid units: right-angle square side; scales ticks, arrows, arcs
  mark_size_jitter: [3.5, 5.5]
  angle_arc_prob: 0.75 # draw an arc under angle labels
  background: white

# Image-level augmentation, applied after rendering (mathvlm.augment). The ground truth
# is never touched. Style randomness (fonts, line widths, ink) lives in render.sample_style.
augment:
  enabled: true # false: every sample is a clean render
  clean_prob: 0.2 # share of samples left untouched (real inputs include clean screenshots)
  rotation_deg: 4.0 # README.md design invariant 6: small, and GT is untouched
  scale_range: [0.85, 1.15]
  blur_sigma_range: [0.0, 1.1]
  gaussian_noise_std: [0.0, 0.035]
  jpeg_quality_range: [55, 95]
  jpeg_prob: 0.6 # otherwise saved losslessly
  paper_texture_strength: [0.0, 0.25] # depth of uneven shading and grain
  paper_tints: [[255, 255, 255], [250, 247, 240], [245, 240, 228], [238, 238, 234]]
  brightness_range: [0.85, 1.12]
  contrast_range: [0.85, 1.15]

generate:
  # relative weights over scene families
  families:
    triangle_cevian: 1.0 # altitude / median / angle bisector
    circle_incircle: 1.0
    circle_circumcircle: 1.0
    quadrilateral_diagonals: 1.0
    tangent_line: 1.0
  no_diagram_fraction: 0.15 # share of samples with "diagram": null
  # geometric validity thresholds, enforced at generation time
  min_angle_deg: 25.0
  min_side_len: 18.0
  min_point_separation: 6.0
  margin: 8.0 # the figure's bounding box is fitted to [margin, 100 - margin]
  max_rejection_attempts: 200
  incidence_tol: 3.0 # a point this close to a segment/circle it is not on by construction -> reject
  horizontal_base_prob: 0.4 # keep the construction's base horizontal; else rotate randomly
  mark_prob: 0.85 # draw the mark for a construction (right angle, ticks, arcs, arrows)
  unnamed_aux_prob: 0.2 # leave a constructed point unlabeled in the figure (named _P<n>)
  prime_name_prob: 0.08 # name a constructed point after a vertex: A', A_1
  label_schemes: # how point names are chosen
    conventional: 0.55 # A, B, C...; feet H/D, midpoints M, centers O/I
    random: 0.35 # random distinct letters
    consecutive: 0.10 # a run starting at a random letter: P, Q, R, S
  questions:
    max_givens: 3
    max_length_givens: 2 # more would over-determine a figure whose values are rounded
    figure_label_prob: 0.6 # a given value is written on the figure
    text_given_prob: 0.6 # ... and/or stated in the text (at least one of the two)
    decimal_length_prob: 0.2 # lengths with one decimal instead of integers
    length_scale: [6.0, 24.0] # the longest candidate length maps into this value range
    variable_unknown_prob: 0.5 # unknown shown as x on the figure vs asked by name
    algebraic_prob: 0.3 # x appears in an expression, e.g. 2x+1, equal to a marked partner
    family_ask_prob: 0.3 # ask for area / perimeter / radius / a proof instead
    two_part_prob: 0.15 # (a) ... (b) ...

eval:
  # similarity alignment for the geometry metric: translation + uniform scale only.
  # No rotation/reflection — image orientation pins those, and allowing them would
  # forgive genuinely flipped diagrams.
  allow_rotation: false
  allow_reflection: false
  unnamed_match_max_dist: 25.0 # grid units; beyond this a _P pair is not a match
  side_by_side_limit: 50 # how many comparison images to write per run
